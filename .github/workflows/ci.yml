name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Pinned exactly: astral-sh publishes no floating v10 tag, and v3 ran on
      # the now-deprecated Node 20.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          # 3.12 is what the Makefile creates and what this actually runs on.
          # `activate-environment` puts uv's managed Python on PATH in a venv;
          # without it, `uv pip install --system` either finds no managed
          # interpreter or hits Debian's externally-managed system Python.
          python-version: "3.12"
          activate-environment: true
          enable-cache: true
          # This project installs with `uv pip install -e .`, not `uv sync`, so
          # there is no uv.lock. Left at its default the cache step globs for
          # one, finds nothing, and fails the job.
          cache-dependency-glob: "pyproject.toml"

      # `app` is needed because the UI tests drive Streamlit. `embed` stays
      # out: the suite runs on the offline hash backend, so CI needs no model
      # download and no network access at all.
      - name: Install
        run: uv pip install -e ".[app,dev]"

      - name: Lint
        run: |
          ruff check src tests app
          ruff format --check src tests app

      - name: Test
        run: pytest --cov=movierec --cov-report=term-missing

      # The end-to-end tests cover ingestion, TMDB resolution, the taste model,
      # the leakage guards and retrieval. They need a Letterboxd export, and
      # `data/` is git-ignored — so they used to skip silently on a clean
      # checkout and CI passed on barely half the suite. conftest now generates
      # an export when none is present; this makes sure that keeps working.
      # A test that silently does not run is worse than no test: it also
      # removes the pressure to write one. The end-to-end tests need a
      # Letterboxd export (git-ignored, so conftest generates one) and the UI
      # tests need Streamlit installed. Both used to skip themselves quietly.
      - name: Fail if any suite silently skipped
        # `shell: bash` gets `-eo pipefail`. Without it the pipe into tee
        # swallows pytest's exit code and the step passes even when the tests
        # fail — or when pytest is not installed at all.
        shell: bash
        run: |
          pytest tests/test_pipeline_e2e.py tests/test_app.py -rs --no-header | tee /tmp/guard.txt
          if grep -qE "no Letterboxd export|app extra is not installed" /tmp/guard.txt; then
            echo "::error::a test suite skipped itself instead of running"
            exit 1
          fi

      - name: Check the CLI is wired up
        run: movierec --version
