name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"

      # The embedding and app extras are deliberately excluded: CI runs against
      # the offline hash backend, so no model download and no network is needed.
      - name: Lint
        run: |
          uv run ruff check src tests app
          uv run ruff format --check src tests app

      - name: Test
        run: uv run pytest -q --cov=movierec --cov-report=term-missing

      - name: Check the CLI is importable and wired up
        run: uv run movierec --version
