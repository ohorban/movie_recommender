name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      # Pinned to an exact version: astral-sh does not publish a floating v10
      # tag, and v3 ran on the now-deprecated Node 20.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          # This project installs with `uv pip install -e .`, not `uv sync`, so
          # there is no uv.lock. Left at its default the cache step globs for
          # one, finds nothing, and fails the job.
          cache-dependency-glob: "pyproject.toml"

      # The `embed` and `app` extras are deliberately excluded: the suite runs
      # on the offline hash backend, so CI needs no model download and no
      # network access at all.
      - name: Install
        run: uv pip install --system -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests app
          ruff format --check src tests app

      - name: Test
        run: pytest --cov=movierec --cov-report=term-missing

      # The end-to-end tests cover ingestion, TMDB resolution, the taste model,
      # the leakage guards and retrieval. They need a Letterboxd export, and
      # `data/` is git-ignored — so on a clean checkout they used to skip
      # silently and CI passed on barely half the suite. conftest now generates
      # an export when none is present; this step makes sure that keeps working.
      - name: Fail if the pipeline tests silently skipped
        run: |
          pytest tests/test_pipeline_e2e.py -rs --no-header | tee /tmp/e2e.txt
          if grep -q "no Letterboxd export" /tmp/e2e.txt; then
            echo "::error::end-to-end tests skipped for want of an export fixture"
            exit 1
          fi

      - name: Check the CLI is wired up
        run: movierec --version
